<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Multicam</title>
    <link rel="icon" href="public/assets/rocket.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2TMZJ2TVLN"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-2TMZJ2TVLN');
</script>


<body>
    <header>
        <button class="info-btn">i</button>
        <select id="cameraConfig">
            <!-- <option value="config1">All</option> -->
            <option value="config1">Starbase</option>
            <!-- <option value="config2">Others</option> -->
        </select>
        <h1>Space Multicam </h1>
        <div class="header-right">
            <a href="https://twitter.com/LEOrbitSpace" target="_blank" rel="noopener noreferrer">@LEOrbitSpace</a>
            <div class="circle-image">
                <img src="public/assets/perfil.jpg" alt="Imagen circular">
            </div>
        </div>
    </header>

    <main id="videoGrid" class="grid-container">
        <!-- Los iframes se agregarán dinámicamente aquí -->
    </main>

    <!-- Modal Unificado -->
    <div id="infoModal" class="modal">
        <div class="modal-content modal-tabs">
            <span class="close-btn" id="infoCloseBtn">&times;</span>

            <div class="tabs-header">
                <button class="tab-btn active" data-tab="credits">Créditos</button>
                <button class="tab-btn" data-tab="admin">Admin</button>
            </div>

            <!-- Pestaña de Créditos -->
            <div id="credits" class="tab-content active">
                <h2>Credits to...</h2>
                <p><a href="https://twitter.com/NASASpaceflight">@NASASpaceflight</a> | <a href="https://www.youtube.com/@NASASpaceflight">Youtube</a></p>
                <p><a href="https://twitter.com/LabPadre">@LabPadre</a> | <a href="https://www.youtube.com/@LabPadre">Youtube</a></p>
                <p><a href="https://twitter.com/SpaceflightNow">@SpaceflightNow</a> | <a href="https://www.youtube.com/@SpaceflightNowVideo">Youtube</a></p>
                <p><a href="https://twitter.com/FelixSchlang">@FelixSchlang</a> | <a href="https://www.youtube.com/@Whataboutit">Youtube</a></p>
                <p><a href="https://www.rocketranchbocachica.com/">@Rocketranchstarbase</a> | <a href="https://www.youtube.com/@rocketranchstarbase">Youtube</a></p>
                <p><a href="https://www.nasa.gov/">@NASA</a> | <a href="https://www.youtube.com/@NASA">Youtube</a></p>
            </div>

            <!-- Pestaña de Admin -->
            <div id="admin" class="tab-content">
                <h2>Admin panel</h2>
                <p class="admin-subtitle">Gestiona links de directos sin editar código.</p>

                <div id="adminAuthSection">
                    <p id="adminAuthHint"></p>
                    <div class="admin-form-grid">
                        <label for="adminPasswordInput">Contraseña</label>
                        <input id="adminPasswordInput" type="password" autocomplete="current-password" />
                        <label for="adminPasswordConfirmInput" id="adminPasswordConfirmLabel">Confirmar contraseña</label>
                        <input id="adminPasswordConfirmInput" type="password" autocomplete="new-password" />
                    </div>
                    <button id="adminUnlockBtn" class="admin-primary-btn">Entrar</button>
                    <p id="adminAuthMessage" class="admin-message"></p>
                </div>

                <div id="adminManagerSection" class="admin-hidden">
                    <div class="admin-toolbar">
                        <label for="adminConfigSelect">Configuración</label>
                        <select id="adminConfigSelect"></select>
                    </div>
                    <div id="adminStreamsList" class="admin-streams-list"></div>
                    <div class="admin-actions">
                        <button id="adminSaveBtn" class="admin-primary-btn">Guardar cambios</button>
                        <button id="adminResetBtn" class="admin-secondary-btn">Restaurar por defecto</button>
                        <button id="adminLogoutBtn" class="admin-secondary-btn admin-danger-btn">Cerrar sesión</button>
                    </div>
                    <p id="adminManagerMessage" class="admin-message"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="js/script.js"></script>
</body>

</html>
